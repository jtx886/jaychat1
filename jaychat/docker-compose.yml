services:
  jaychat:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: jaychat-server:latest
    container_name: jaychat
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      - ./deploy/data:/app/data
      - ./deploy/uploads:/app/public/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：用 Caddy 自动申请 HTTPS 证书（有自己的域名时）
