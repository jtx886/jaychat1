plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jaychat.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.jaychat.app"
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName "3.0.3"
    }

    signingConfigs {
        release {
            storeFile file('jaychat-release.keystore')
            storePassword 'jaychat123'
            keyAlias 'jaychat'
            keyPassword 'jaychat123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    systemProperty 'robolectric.dependency.repo.url', 'https://maven.aliyun.com/repository/public'
    systemProperty 'robolectric.dependency.repo.id', 'aliyun'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
